<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>광고관제소</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;background:#f0f2f5;color:#1a1d23;font-size:14px;height:100vh;overflow:hidden;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px;}
input,select,button{font-family:inherit;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

/* ─── 상수 ─── */
const API_BASE = window.location.hostname==="localhost" ? "http://localhost:4000/api" : "/api";

const CHANNELS = ["meta","naver","google","daangn","tiktok","kakao"];
const CH_LABEL = {meta:"Meta",naver:"네이버",google:"구글",daangn:"당근",tiktok:"틱톡",kakao:"카카오"};
const CH_COLOR = {meta:"#2563eb",naver:"#16a34a",google:"#ea4335",daangn:"#ff6f0f",tiktok:"#111827",kakao:"#ca8a04"};
const CH_INPUTS = {
  naver:[{k:"apiKey",label:"API Key",pw:true,ph:"Access License Key"},{k:"secretKey",label:"Secret Key",pw:true,ph:"Secret Key"},{k:"customerId",label:"Customer ID",ph:"광고주 ID"}],
  meta:[{k:"accountId",label:"Ad Account ID",ph:"act_XXXXXXXXXX"},{k:"accessToken",label:"Access Token",pw:true,ph:"장기 액세스 토큰"}],
  google:[{k:"customerId",label:"Customer ID",ph:"XXX-XXX-XXXX"},{k:"developerToken",label:"Developer Token",pw:true},{k:"refreshToken",label:"Refresh Token",pw:true}],
  daangn:[{k:"apiKey",label:"API Key",pw:true},{k:"accountId",label:"Account ID"}],
  tiktok:[{k:"accessToken",label:"Access Token",pw:true},{k:"advertiserId",label:"Advertiser ID"}],
  kakao:[{k:"apiKey",label:"REST API Key",pw:true},{k:"accountId",label:"Ad Account ID"},{k:"accessToken",label:"Access Token",pw:true}],
};
const BRAND_COLORS=["#f59e0b","#2563eb","#16a34a","#e35353","#7c3aed","#0891b2","#db2777","#374151"];
const NAV=[
  {id:"dashboard",icon:"▦",label:"전체 대시보드"},
  {id:"report",icon:"▤",label:"리포트"},
  {id:"naver-kw",icon:"●",label:"네이버 키워드 리포트"},
  {id:"meta-report",icon:"◆",label:"Meta 소재 리포트"},
  {id:"keyword",icon:"🔍",label:"키워드 분석"},
  {id:"fatigue",icon:"🔥",label:"소재 피로도"},
  {id:"reregist",icon:"↻",label:"소재 재등록 센터"},
  {id:"library",icon:"▣",label:"소재 라이브러리"},
  {id:"automation",icon:"⚙",label:"자동화 룰"},
  {id:"accounts",icon:"🔗",label:"광고계정 / 연동"},
  {id:"budget",icon:"◐",label:"브랜드 / 예산"},
  {id:"alerts",icon:"🔔",label:"알림 / 로그"},
];
const NAV_DISABLED=[
  {id:"campaigns",icon:"📣",label:"캠페인 관리"},
  {id:"funnel",icon:"📈",label:"전환 / 퍼널 분석"},
  {id:"slots",icon:"🗓",label:"예약 / 슬롯"},
  {id:"weather",icon:"☁",label:"날씨 / 시즌 캘린더"},
];

/* ─── 공통 스타일 ─── */
const card={background:"#fff",borderRadius:14,padding:"20px 22px",border:"1px solid #e9eaec"};
const lbl={fontSize:12,fontWeight:600,color:"#6b7280",marginBottom:5,display:"block"};
const inp={padding:"9px 12px",border:"1.5px solid #e5e7eb",borderRadius:8,fontSize:13,width:"100%",outline:"none",color:"#1a1d23",transition:"border-color .15s"};
const btn=(bg="#2563eb",color="#fff")=>({padding:"9px 18px",borderRadius:9,border:"none",background:bg,color,fontSize:13,fontWeight:700,cursor:"pointer"});

/* ─── 인증 관련 ─── */
const getToken=()=>sessionStorage.getItem("acc_token");
const setToken=t=>sessionStorage.setItem("acc_token",t);
const getUser=()=>{try{return JSON.parse(sessionStorage.getItem("acc_user")||"null");}catch{return null;}};
const setUser=u=>sessionStorage.setItem("acc_user",JSON.stringify(u));
const clearAuth=()=>{sessionStorage.removeItem("acc_token");sessionStorage.removeItem("acc_user");};

/* ─── API 호출 ─── */
async function api(path,options={}){
  const token=getToken();
  const res=await fetch(API_BASE+path,{
    headers:{"Content-Type":"application/json",...(token?{Authorization:`Bearer ${token}`}:{})},
    ...options,
  });
  if(res.status===401){clearAuth();window.location.reload();return;}
  const data=await res.json();
  if(!res.ok) throw new Error(data.error||res.statusText);
  return data;
}
async function apiLogin(email,password){
  const res=await fetch(API_BASE+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  const data=await res.json();
  if(!res.ok) throw new Error(data.error||"로그인 실패");
  setToken(data.token);setUser(data.user);
  return data.user;
}

/* ─── Toast ─── */
function useToast(){
  const [toasts,setToasts]=useState([]);
  const show=useCallback((msg,type="success")=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3500);
  },[]);
  return{toasts,toast:show};
}
function Toasts({toasts}){
  return(
    <div style={{position:"fixed",bottom:24,right:24,zIndex:999,display:"flex",flexDirection:"column",gap:8}}>
      {toasts.map(t=>(
        <div key={t.id} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px",borderRadius:10,
          background:t.type==="success"?"#16a34a":t.type==="error"?"#e35353":"#2563eb",
          color:"#fff",fontSize:13,fontWeight:600,minWidth:220,animation:"fadeIn .2s ease",
          boxShadow:"0 4px 20px rgba(0,0,0,.15)"}}>
          <span>{t.type==="success"?"✓":t.type==="error"?"✕":"ℹ"}</span>
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

/* ─── 로딩 스피너 ─── */
function Spinner({size=32}){
  return <div style={{width:size,height:size,border:"3px solid #e5e7eb",borderTop:"3px solid #2563eb",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>;
}

/* ─── 로그인 페이지 ─── */
function LoginPage({onLogin}){
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");

  const submit=async e=>{
    e.preventDefault();setLoading(true);setError("");
    try{const user=await apiLogin(email,pw);onLogin(user);}
    catch(e){setError(e.message);}
    finally{setLoading(false);}
  };

  return(
    <div style={{minHeight:"100vh",background:"#f0f2f5",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#fff",borderRadius:18,padding:"40px 36px",width:400,boxShadow:"0 4px 24px rgba(0,0,0,.08)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:32}}>
          <div style={{width:42,height:42,borderRadius:12,background:"linear-gradient(135deg,#2563eb,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:16}}>AD</div>
          <div><div style={{fontSize:18,fontWeight:700}}>광고관제소</div><div style={{fontSize:12,color:"#9ca3af"}}>Ad Control Center</div></div>
        </div>
        <form onSubmit={submit}>
          <div style={{marginBottom:14}}>
            <label style={lbl}>이메일</label>
            <input style={inp} type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="이메일 입력" required autoFocus
              onFocus={e=>e.target.style.borderColor="#2563eb"} onBlur={e=>e.target.style.borderColor="#e5e7eb"}/>
          </div>
          <div style={{marginBottom:20}}>
            <label style={lbl}>비밀번호</label>
            <input style={inp} type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="비밀번호 입력" required
              onFocus={e=>e.target.style.borderColor="#2563eb"} onBlur={e=>e.target.style.borderColor="#e5e7eb"}/>
          </div>
          {error&&<div style={{background:"#fdecec",color:"#e35353",borderRadius:8,padding:"10px 14px",fontSize:13,marginBottom:14}}>{error}</div>}
          <button type="submit" disabled={loading} style={{...btn(),width:"100%",padding:"12px",opacity:loading?.7:1}}>
            {loading?"로그인 중...":"로그인"}
          </button>
        </form>
        <div style={{marginTop:20,padding:"14px",background:"#f9fafb",borderRadius:8,fontSize:12,color:"#6b7280"}}>
          최초 관리자 계정: <code style={{fontSize:11}}>POST /api/auth/setup</code>
        </div>
      </div>
    </div>
  );
}

/* ─── 사이드바 ─── */
function Sidebar({page,setPage,user,onLogout}){
  return(
    <aside style={{width:228,background:"#15181f",flexShrink:0,display:"flex",flexDirection:"column",padding:"16px 10px",overflowY:"auto"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"4px 8px 16px"}}>
        <div style={{width:32,height:32,borderRadius:9,background:"linear-gradient(135deg,#2563eb,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:13,flexShrink:0}}>AD</div>
        <div><div style={{fontSize:14,fontWeight:700,color:"#fff",lineHeight:1.2}}>광고관제소</div><div style={{fontSize:10,color:"#6b7280"}}>Ad Control Center</div></div>
      </div>
      {NAV.map(n=>(
        <div key={n.id} onClick={()=>setPage(n.id)}
          style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:8,fontSize:13,cursor:"pointer",marginBottom:1,
            background:page===n.id?"#262b35":"transparent",color:page===n.id?"#fff":"#8b939f",fontWeight:page===n.id?600:400,transition:".12s"}}>
          <span style={{width:16,textAlign:"center"}}>{n.icon}</span>{n.label}
        </div>
      ))}
      <div style={{height:1,background:"#262b35",margin:"12px 4px"}}/>
      <div style={{fontSize:10,color:"#4b505c",padding:"4px 10px 6px"}}>준비중</div>
      {NAV_DISABLED.map(n=>(
        <div key={n.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:8,fontSize:13,color:"#4b505c",marginBottom:1}}>
          <span style={{width:16,textAlign:"center"}}>{n.icon}</span>{n.label}
        </div>
      ))}
      <div style={{marginTop:"auto",paddingTop:12,borderTop:"1px solid #262b35"}}>
        <div style={{padding:"8px 10px",borderRadius:8,background:"#1e2330",marginBottom:4}}>
          <div style={{fontSize:12,color:"#fff",fontWeight:600}}>{user.name||user.email}</div>
          <div style={{fontSize:10,color:"#6b7280"}}>{user.role==="admin"?"관리자":"광고주"}</div>
        </div>
        <div onClick={onLogout} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:8,fontSize:12,color:"#6b7280",cursor:"pointer"}}
          onMouseEnter={e=>e.currentTarget.style.color="#e35353"}
          onMouseLeave={e=>e.currentTarget.style.color="#6b7280"}>
          ⎋ 로그아웃
        </div>
      </div>
    </aside>
  );
}

/* ─── 대시보드 ─── */
function Dashboard({advertisers}){
  const [period,setPeriod]=useState("30");
  const [stats,setStats]=useState({byChannel:{},mix:[]});
  const [loading,setLoading]=useState(true);

  const getPeriodDates=p=>{
    const end=new Date();end.setDate(end.getDate()-1);
    const start=new Date(end);
    if(p==="오늘"){const t=new Date();return{s:t.toISOString().slice(0,10),e:t.toISOString().slice(0,10)};}
    if(p==="어제"){return{s:end.toISOString().slice(0,10),e:end.toISOString().slice(0,10)};}
    start.setDate(end.getDate()-(Number(p)-1));
    return{s:start.toISOString().slice(0,10),e:end.toISOString().slice(0,10)};
  };

  const load=async()=>{
    setLoading(true);
    const{s,e}=getPeriodDates(period);
    try{
      const[byChannel,mix]=await Promise.all([
        api(`/stats/by-channel?startDate=${s}&endDate=${e}`),
        api(`/stats/channel-mix?startDate=${s}&endDate=${e}`)
      ]);
      const map={};
      (byChannel||[]).forEach(r=>{map[r.channel]={
        cost:+r.cost||0,impressions:+r.impressions||0,clicks:+r.clicks||0,
        conversions:+r.conversions||0,convAmount:+r.conversion_amount||0,
        ctr:+r.ctr||0,cpc:+r.cpc||0,cpm:+r.cpm||0,roas:+r.roas||0
      };});
      setStats({byChannel:map,mix:mix||[]});
    }catch(e){console.error(e);}
    finally{setLoading(false);}
  };

  useEffect(()=>{load();},[period]);

  const fmtW=n=>`₩${Math.round(n).toLocaleString()}`;
  const total=Object.values(stats.byChannel).reduce((a,v)=>({
    cost:a.cost+v.cost,impressions:a.impressions+v.impressions,
    clicks:a.clicks+v.clicks,conversions:a.conversions+v.conversions,convAmount:a.convAmount+v.convAmount
  }),{cost:0,impressions:0,clicks:0,conversions:0,convAmount:0});

  // 광고주별 채널 믹스 집계
  const advMap={};
  stats.mix.forEach(r=>{
    if(!advMap[r.id])advMap[r.id]={name:r.name,color:r.brand_color,budget:+r.monthly_budget||0,total:0,channels:{}};
    advMap[r.id].total+=+r.cost||0;
    advMap[r.id].channels[r.channel]=+r.cost||0;
  });
  const advList=Object.values(advMap);

  const PERIODS=[["오늘","오늘"],["어제","어제"],["7","7일"],["14","14일"],["30","30일"],["60","60일"],["90","90일"]];

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {/* 채널 믹스 */}
      <div style={card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontWeight:700,fontSize:15,marginBottom:8}}>채널별 광고비 믹스</div>
            <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
              {CHANNELS.map(ch=>(
                <span key={ch} style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:12,color:"#6b7280"}}>
                  <span style={{width:8,height:8,borderRadius:2,background:CH_COLOR[ch],display:"inline-block"}}/>
                  {CH_LABEL[ch]}
                </span>
              ))}
            </div>
          </div>
          <span style={{fontSize:11,color:"#9ca3af"}}>최근 {period}일 기준</span>
        </div>
        {loading?<div style={{color:"#9ca3af",fontSize:13}}>불러오는 중...</div>
        :advList.length===0?<div style={{color:"#9ca3af",fontSize:13}}>수집된 데이터가 없습니다. 배치를 실행해주세요.</div>
        :advList.map(adv=>(
          <div key={adv.name} style={{marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{fontWeight:700,fontSize:13}}>{adv.name}</span>
              <span style={{fontSize:12,color:"#6b7280"}}>
                <b style={{color:"#1a1d23"}}>{fmtW(adv.total)}</b>
                {Object.entries(adv.channels).map(([ch,c])=><span key={ch}> · {CH_LABEL[ch]} {fmtW(c)}</span>)}
              </span>
            </div>
            <div style={{height:9,borderRadius:5,background:"#f0f2f5",overflow:"hidden",display:"flex"}}>
              {Object.entries(adv.channels).map(([ch,c])=>(
                <div key={ch} style={{width:`${adv.total>0?c/adv.total*100:0}%`,background:CH_COLOR[ch]}}/>
              ))}
            </div>
          </div>
        ))}
        <div style={{fontSize:12,color:"#9ca3af",marginTop:4}}>전체 합계 {fmtW(total.cost)}</div>
      </div>

      {/* 성과 지표 테이블 */}
      <div style={card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
          <div style={{fontWeight:700,fontSize:15}}>광고 성과 지표</div>
          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            {PERIODS.map(([v,l])=>(
              <button key={v} onClick={()=>setPeriod(v)}
                style={{padding:"6px 11px",borderRadius:7,fontSize:12,fontWeight:600,cursor:"pointer",border:"none",
                  background:period===v?"#2563eb":"transparent",color:period===v?"#fff":"#9ca3af"}}>
                {l}
              </button>
            ))}
          </div>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:800}}>
            <thead>
              <tr>{["매체","총소진","노출","CPM","클릭","CTR","CPC","전환","전환율","전환매출","CPA","ROAS"].map(h=>(
                <th key={h} style={{textAlign:h==="매체"?"left":"right",padding:"8px 10px",borderBottom:"1px solid #f0f2f5",fontWeight:500,color:"#9ca3af",fontSize:12,whiteSpace:"nowrap"}}>{h}</th>
              ))}</tr>
            </thead>
            <tbody>
              {CHANNELS.map(ch=>{
                if(ch==="tiktok")return(
                  <tr key={ch}><td style={{padding:"12px 10px",fontWeight:600}}>
                    틱톡 <span style={{fontSize:10,background:"#f3f4f6",color:"#9ca3af",padding:"2px 7px",borderRadius:999,marginLeft:4}}>연동 대기</span>
                  </td>{Array(11).fill(0).map((_,i)=><td key={i} style={{textAlign:"right",padding:"12px 10px",color:"#d1d5db"}}>-</td>)}</tr>
                );
                const s=stats.byChannel[ch];
                if(!s||s.cost===0)return(
                  <tr key={ch} style={{opacity:.4}}>
                    <td style={{padding:"12px 10px",fontWeight:600}}>{CH_LABEL[ch]}</td>
                    {Array(11).fill(0).map((_,i)=><td key={i} style={{textAlign:"right",padding:"12px 10px",color:"#d1d5db"}}>-</td>)}
                  </tr>
                );
                const cpm=s.impressions?(s.cost/s.impressions*1000).toFixed(0):"-";
                const ctr=s.impressions?(s.clicks/s.impressions*100).toFixed(2)+"%":"-";
                const cpc=s.clicks?(s.cost/s.clicks).toFixed(0):"-";
                const cvr=s.clicks?(s.conversions/s.clicks*100).toFixed(2)+"%":"-";
                const cpa=s.conversions?(s.cost/s.conversions).toFixed(0):"-";
                const roas=s.cost?(s.convAmount/s.cost*100).toFixed(0):"-";
                return(
                  <tr key={ch} style={{borderBottom:"1px solid #f9fafb"}}>
                    <td style={{padding:"12px 10px",fontWeight:600}}>{CH_LABEL[ch]}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{fmtW(s.cost)}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{s.impressions.toLocaleString()}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{cpm==="-"?"-":`₩${(+cpm).toLocaleString()}`}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{s.clicks.toLocaleString()}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{ctr}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{cpc==="-"?"-":`₩${(+cpc).toLocaleString()}`}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{s.conversions}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{cvr}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{s.convAmount?fmtW(s.convAmount):"-"}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{cpa==="-"?"-":`₩${(+cpa).toLocaleString()}`}</td>
                    <td style={{textAlign:"right",padding:"12px 10px",fontWeight:600,
                      color:roas!=="-"?(+roas>=100?"#16a34a":"#e35353"):"inherit"}}>
                      {roas==="-"?"-":`${roas}%`}
                    </td>
                  </tr>
                );
              })}
              {/* 합산 */}
              <tr style={{background:"#fafafa",fontWeight:700,borderTop:"2px solid #e9eaec"}}>
                <td style={{padding:"12px 10px"}}>전체 합산<div style={{fontSize:11,fontWeight:400,color:"#9ca3af",marginTop:2}}>모든 매체</div></td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{fmtW(total.cost)}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{total.impressions.toLocaleString()}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{total.impressions?`₩${Math.round(total.cost/total.impressions*1000).toLocaleString()}`:"-"}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{total.clicks.toLocaleString()}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{total.impressions?(total.clicks/total.impressions*100).toFixed(2)+"%":"-"}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{total.clicks?`₩${Math.round(total.cost/total.clicks).toLocaleString()}`:"-"}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{total.conversions}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{total.clicks?(total.conversions/total.clicks*100).toFixed(2)+"%":"-"}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{total.convAmount?fmtW(total.convAmount):"-"}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{total.conversions?`₩${Math.round(total.cost/total.conversions).toLocaleString()}`:"-"}</td>
                <td style={{textAlign:"right",padding:"12px 10px",color:"#16a34a"}}>{total.cost?Math.round(total.convAmount/total.cost*100)+"%":"-"}</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div style={{fontSize:11,color:"#9ca3af",marginTop:10}}>CPM=노출단가, CPC=클릭단가, CTR=클릭/노출, CPA=전환당비용, ROAS=매출/광고비</div>
      </div>

      {/* 하단 2열 */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        {/* 예산 소진율 */}
        <div style={card}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>브랜드별 예산 소진율</div>
          {advList.length===0?<div style={{fontSize:13,color:"#9ca3af"}}>수집된 데이터가 없습니다</div>
          :advList.map(adv=>{
            const p=adv.budget>0?Math.min(adv.total/adv.budget*100,100):0;
            return(
              <div key={adv.name} style={{marginBottom:14}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:13}}>
                  <span style={{display:"flex",alignItems:"center",gap:7,fontWeight:600}}>
                    <span style={{width:8,height:8,borderRadius:2,background:adv.color}}/>
                    {adv.name}
                  </span>
                  <span style={{color:"#6b7280"}}>
                    {fmtW(adv.total)} / {adv.budget?fmtW(adv.budget):"-"}
                    {adv.budget>0&&<span style={{marginLeft:8,background:"#eafaf0",color:"#16a34a",fontWeight:700,fontSize:11,padding:"2px 7px",borderRadius:5}}>{p.toFixed(1)}%</span>}
                  </span>
                </div>
                <div style={{height:8,borderRadius:5,background:"#f0f2f5",overflow:"hidden"}}>
                  <div style={{width:`${p}%`,height:"100%",background:adv.color,borderRadius:5}}/>
                </div>
              </div>
            );
          })}
        </div>
        {/* 추천 조치 */}
        <div style={card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontWeight:700,fontSize:15}}>추천 조치</div>
            <span style={{background:"#eafaf0",color:"#16a34a",fontWeight:700,fontSize:11,padding:"3px 9px",borderRadius:999}}>0건</span>
          </div>

        </div>
      </div>
    </div>
  );
}

/* ─── 채널 키 등록 모달 ─── */
function ChannelKeyModal({advertiserId,channel,onClose,onSuccess}){
  const inputs=CH_INPUTS[channel]||[];
  const [fields,setFields]=useState({});
  const [saving,setSaving]=useState(false);
  const [result,setResult]=useState(null);

  const save=async()=>{
    const missing=inputs.filter(({k})=>!fields[k]?.trim());
    if(missing.length){alert(`${missing.map(m=>m.label).join(", ")}을(를) 입력해주세요`);return;}
    setSaving(true);setResult(null);
    try{
      // 1. 저장
      await api(`/advertisers/${advertiserId}`,{method:"PUT",body:JSON.stringify({accounts:[{channel,credentials:fields}]})});
      // 2. 연동 테스트
      const r=await api(`/advertisers/${advertiserId}/channels/${channel}/test`,{method:"POST",body:JSON.stringify({credentials:fields})});
      setResult(r);
      if(r.ok){setTimeout(()=>{onSuccess(r.message);onClose();},1500);}
    }catch(e){setResult({ok:false,message:e.message});}
    finally{setSaving(false);}
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}
      onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:"#fff",borderRadius:16,width:460,padding:"28px 26px",position:"relative"}}>
        <button onClick={onClose} style={{position:"absolute",top:14,right:16,background:"none",border:"none",fontSize:20,color:"#9ca3af",cursor:"pointer"}}>✕</button>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
          <div style={{width:28,height:28,borderRadius:7,background:CH_COLOR[channel],display:"flex",alignItems:"center",justifyContent:"center",color:channel==="kakao"?"#111":"#fff",fontSize:11,fontWeight:700}}>
            {channel==="daangn"?"당":channel[0].toUpperCase()}
          </div>
          <div style={{fontWeight:700,fontSize:16}}>{CH_LABEL[channel]} 연동</div>
        </div>
        {inputs.map(({k,label,pw,ph})=>(
          <div key={k} style={{marginBottom:12}}>
            <label style={lbl}>{label}</label>
            <input style={inp} type={pw?"password":"text"} placeholder={ph||label}
              value={fields[k]||""} onChange={e=>setFields(f=>({...f,[k]:e.target.value}))}
              onFocus={e=>e.target.style.borderColor="#2563eb"} onBlur={e=>e.target.style.borderColor="#e5e7eb"}/>
          </div>
        ))}
        {result&&(
          <div style={{padding:"10px 14px",borderRadius:8,marginBottom:12,fontSize:13,fontWeight:600,
            background:result.ok?"#eafaf0":"#fdecec",color:result.ok?"#16a34a":"#e35353"}}>
            {result.ok?"✓ "+result.message:"✕ "+result.message}
          </div>
        )}
        <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8}}>
          <button onClick={onClose} style={{...btn("#f3f4f6","#6b7280")}}>취소</button>
          <button onClick={save} disabled={saving} style={{...btn(),opacity:saving?.7:1}}>
            {saving?"저장 및 테스트 중...":"저장하고 연동 테스트"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─── 광고주 추가/편집 모달 ─── */
function AdvModal({adv,onSave,onClose}){
  const isEdit=!!adv;
  const [name,setName]=useState(adv?.name||"");
  const [color,setColor]=useState(adv?.color||BRAND_COLORS[0]);
  const [budget,setBudget]=useState(adv?.budget||"");
  const [saving,setSaving]=useState(false);

  const save=async()=>{
    if(!name.trim()){alert("광고주명을 입력하세요");return;}
    setSaving(true);
    try{await onSave({name,color,budget:Number(budget)||0});}
    finally{setSaving(false);}
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center"}}
      onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:"#fff",borderRadius:16,width:420,padding:"28px 26px",position:"relative"}}>
        <button onClick={onClose} style={{position:"absolute",top:14,right:16,background:"none",border:"none",fontSize:20,color:"#9ca3af",cursor:"pointer"}}>✕</button>
        <div style={{fontWeight:700,fontSize:17,marginBottom:20}}>{isEdit?"광고주 편집":"광고주 추가"}</div>
        <div style={{marginBottom:12}}>
          <label style={lbl}>광고주명 *</label>
          <input style={inp} value={name} onChange={e=>setName(e.target.value)} placeholder="예) 다방"
            onFocus={e=>e.target.style.borderColor="#2563eb"} onBlur={e=>e.target.style.borderColor="#e5e7eb"}/>
        </div>
        <div style={{marginBottom:12}}>
          <label style={lbl}>월 예산 (원)</label>
          <input style={inp} value={budget} onChange={e=>setBudget(e.target.value.replace(/\D/g,""))} placeholder="예) 3000000"
            onFocus={e=>e.target.style.borderColor="#2563eb"} onBlur={e=>e.target.style.borderColor="#e5e7eb"}/>
        </div>
        <div style={{marginBottom:20}}>
          <label style={lbl}>브랜드 색상</label>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {BRAND_COLORS.map(c=>(
              <div key={c} onClick={()=>setColor(c)} style={{width:28,height:28,borderRadius:7,background:c,cursor:"pointer",
                border:color===c?"2.5px solid #1a1d23":"2.5px solid transparent",transform:color===c?"scale(1.1)":"none",transition:".15s"}}/>
            ))}
          </div>
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button onClick={onClose} style={{...btn("#f3f4f6","#6b7280")}}>취소</button>
          <button onClick={save} disabled={saving} style={{...btn(),opacity:saving?.7:1}}>{saving?"저장 중...":"저장"}</button>
        </div>
      </div>
    </div>
  );
}

/* ─── 광고주 관리 페이지 ─── */
function AccountsPage({advertisers,onReload,isAdmin}){
  const [advModal,setAdvModal]=useState(null);
  const [chModal,setChModal]=useState(null);
  const {toasts,toast}=useToast();

  const saveAdv=async(data)=>{
    if(advModal==="add"){
      await api("/advertisers",{method:"POST",body:JSON.stringify({name:data.name,brand_color:data.color,monthly_budget:data.budget,accounts:[]})});
      toast(`${data.name} 등록 완료`);
    }else{
      await api(`/advertisers/${advModal.id}`,{method:"PUT",body:JSON.stringify({name:data.name,brand_color:data.color,monthly_budget:data.budget})});
      toast(`${data.name} 수정 완료`);
    }
    await onReload();setAdvModal(null);
  };

  const deleteAdv=async(adv)=>{
    if(!window.confirm(`"${adv.name}"을(를) 삭제할까요?`))return;
    await api(`/advertisers/${adv.id}`,{method:"DELETE"});
    toast(`${adv.name} 삭제됨`,"error");
    await onReload();
  };

  const handleTest=async(advertiserId,channel)=>{
    try{
      // saveResult:false → DB status 변경 없이 결과만 확인
      const r=await api(`/advertisers/${advertiserId}/channels/${channel}/test`,{
        method:"POST",
        body:JSON.stringify({credentials:{},saveResult:false})
      });
      toast(r.ok?`${CH_LABEL[channel]} 연동 확인 완료 ✓`:`${CH_LABEL[channel]} 테스트 실패: ${r.message}`,r.ok?"success":"error");
    }catch(e){toast(e.message,"error");}
  };

  return(
    <div>
      <Toasts toasts={toasts}/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:22}}>
        <div>
          <div style={{fontWeight:700,fontSize:20}}>광고주 관리</div>
          <div style={{fontSize:13,color:"#9ca3af",marginTop:4}}>광고주별 채널 API 키를 등록하면 대시보드에 자동 통합됩니다</div>
        </div>
        {isAdmin&&<button onClick={()=>setAdvModal("add")} style={{...btn()}}>+ 광고주 추가</button>}
      </div>

      {/* 광고주 카드 */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:16,marginBottom:24}}>
        {advertisers.map(adv=>{
          const connCnt=CHANNELS.filter(ch=>adv.accounts?.[ch]?.connected).length;
          return(
            <div key={adv.id} style={{...card,position:"relative"}}>
              {isAdmin&&(
                <div style={{position:"absolute",top:16,right:16,display:"flex",gap:6}}>
                  <button onClick={()=>setAdvModal(adv)} style={{...btn("#f3f4f6","#6b7280"),padding:"5px 12px",fontSize:12}}>편집</button>
                  <button onClick={()=>deleteAdv(adv)} style={{...btn("#fdecec","#e35353"),padding:"5px 12px",fontSize:12}}>삭제</button>
                </div>
              )}
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
                <div style={{width:40,height:40,borderRadius:11,background:adv.color,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:16,flexShrink:0}}>{adv.name[0]}</div>
                <div>
                  <div style={{fontWeight:700,fontSize:15}}>{adv.name}</div>
                  <div style={{fontSize:12,color:"#9ca3af",marginTop:2}}>채널 {connCnt}개 연동</div>
                </div>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
                {CHANNELS.map(ch=>{
                  const acc=adv.accounts?.[ch];
                  const connected=acc?.connected;
                  const isError=acc?.status==="error";
                  return(
                    <span key={ch} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"4px 9px",borderRadius:6,fontSize:11,fontWeight:700,
                      background:connected?"#eafaf0":isError?"#fdecec":"#f3f4f6",
                      color:connected?"#16a34a":isError?"#e35353":"#9ca3af"}}>
                      <span style={{width:5,height:5,borderRadius:"50%",background:connected?"#16a34a":isError?"#e35353":"#d1d5db"}}/>
                      {CH_LABEL[ch]}{connected?" 연결됨":""}

                })}
              </div>
              <div style={{paddingTop:12,borderTop:"1px solid #f0f2f5",display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div><div style={{fontSize:11,color:"#9ca3af",marginBottom:3}}>월 예산</div><div style={{fontSize:14,fontWeight:700}}>{adv.budget?`₩${adv.budget.toLocaleString()}`:"-"}</div></div>
                <div><div style={{fontSize:11,color:"#9ca3af",marginBottom:3}}>연동 채널</div><div style={{fontSize:14,fontWeight:700,color:"#16a34a"}}>{connCnt}개</div></div>
              </div>
            </div>

        {isAdmin&&(

            onMouseEnter={e=>{e.currentTarget.style.borderColor="#9ca3af";e.currentTarget.style.color="#9ca3af";}}

            <div style={{fontSize:28,marginBottom:8}}>＋</div>
            <div style={{fontSize:14}}>새 광고주 추가</div>
          </div>

      {/* 채널별 연동 현황 */}
      <div style={{fontWeight:700,fontSize:16,marginBottom:14}}>채널별 연동 현황</div>
      {advertisers.map(adv=>(
        <div key={adv.id} style={{...card,marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,paddingBottom:12,borderBottom:"1px solid #f0f2f5"}}>
            <div style={{width:32,height:32,borderRadius:9,background:adv.color,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:14}}>{adv.name[0]}</div>
            <div style={{fontWeight:700,fontSize:15}}>{adv.name}</div>
          </div>
          {CHANNELS.map(ch=>{
            const acc=adv.accounts?.[ch];
            const connected=acc?.connected;
            const isError=acc?.status==="error";
            return(
              <div key={ch} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 0",borderBottom:"1px solid #f9fafb"}}>
                <div style={{width:28,height:28,borderRadius:7,background:CH_COLOR[ch],display:"flex",alignItems:"center",justifyContent:"center",color:ch==="kakao"?"#111":"#fff",fontSize:11,fontWeight:700,flexShrink:0}}>
                  {ch==="daangn"?"당":ch[0].toUpperCase()}
                </div>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontWeight:600,fontSize:13}}>{CH_LABEL[ch]}</span>
                    <span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:999,
                      background:connected?"#eafaf0":isError?"#fdecec":"#f3f4f6",
                      color:connected?"#16a34a":isError?"#e35353":"#9ca3af"}}>
                      {connected?"● 연결됨":isError?"● 오류":"○ 미연동"}
                    </span>
                    {acc?.last_synced_at&&connected&&(
                      <span style={{fontSize:10,color:"#9ca3af"}}>마지막 수집: {new Date(acc.last_synced_at).toLocaleDateString("ko-KR")}</span>
                    )}
                  </div>
                  {isError&&acc?.error_message&&(
                    <div style={{fontSize:11,color:"#e35353",marginTop:3}}>{acc.error_message.slice(0,80)}</div>
                  )}
                </div>

                  <button onClick={()=>handleTest(adv.id,ch,adv.accounts)}
                    style={{...btn("#f3f4f6","#6b7280"),padding:"5px 12px",fontSize:11,flexShrink:0}}>
                    연동 테스트
                  </button>
                ):(
                  <button onClick={()=>setChModal({advertiserId:adv.id,channel:ch})}
                    style={{...btn("#eaf1ff","#2563eb"),padding:"5px 12px",fontSize:11,border:"1.5px solid #2563eb",flexShrink:0}}>

                  </button>
                )}
              </div>
            );
          })}
        </div>
      ))}

      {/* 모달 */}
      {advModal&&<AdvModal adv={advModal==="add"?null:advModal} onSave={saveAdv} onClose={()=>setAdvModal(null)}/>}
      {chModal&&(
        <ChannelKeyModal
          advertiserId={chModal.advertiserId}
          channel={chModal.channel}
          onClose={()=>setChModal(null)}
          onSuccess={msg=>{toast(`${CH_LABEL[chModal.channel]} 연동 완료!`);onReload();}}
        />
      )}
    </div>
  );
}

/* ─── 알림/로그 페이지 ─── */
function LogsPage(){
  const [logs,setLogs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filter,setFilter]=useState("all");

  const load=useCallback(async()=>{
    setLoading(true);
    try{const d=await api("/logs?limit=100");setLogs(d||[]);}
    catch(e){console.error(e);}
    finally{setLoading(false);}
  },[]);

  useEffect(()=>{load();},[]);

  const SC={success:{c:"#16a34a",bg:"#eafaf0",l:"성공"},error:{c:"#e35353",bg:"#fdecec",l:"오류"},warning:{c:"#f59e0b",bg:"#fff8ec",l:"경고"},info:{c:"#2563eb",bg:"#eaf1ff",l:"정보"}};
  const TC={batch:"⚙",connect:"🔗",error:"❌",info:"ℹ",warning:"⚠"};
  const filtered=filter==="all"?logs:logs.filter(l=>l.status===filter||l.type===filter);
  const fmt=ts=>new Date(ts).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div>
          <div style={{fontWeight:700,fontSize:20}}>알림 / 로그</div>
          <div style={{fontSize:13,color:"#9ca3af",marginTop:4}}>배치 실행, 채널 연동, 오류 내역</div>
        </div>
        <button onClick={load} style={{...btn("#f3f4f6","#6b7280")}}>🔄 새로고침</button>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        {[["all","전체"],["success","성공"],["error","오류"],["warning","경고"],["batch","배치"],["connect","연동"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)}
            style={{padding:"6px 14px",borderRadius:20,border:"none",fontSize:12,fontWeight:600,cursor:"pointer",
              background:filter===v?"#2563eb":"#f3f4f6",color:filter===v?"#fff":"#6b7280"}}>
            {l}{filter===v?` (${filtered.length})`:""}
          </button>
        ))}
      </div>
      {loading?<div style={{display:"flex",justifyContent:"center",padding:40}}><Spinner/></div>
      :filtered.length===0?<div style={{...card,textAlign:"center",padding:40,color:"#9ca3af"}}><div style={{fontSize:32,marginBottom:12}}>📋</div>로그가 없습니다</div>
      :(
        <div style={{...card,padding:0,overflow:"hidden"}}>
          {filtered.map((log,i)=>{
            const sc=SC[log.status]||SC.info;
            return(
              <div key={log.id} style={{display:"flex",alignItems:"flex-start",gap:14,padding:"13px 20px",
                borderBottom:i<filtered.length-1?"1px solid #f9fafb":"none",background:i%2===0?"#fff":"#fafafa"}}>
                <div style={{fontSize:16,flexShrink:0,marginTop:1}}>{TC[log.type]||"ℹ"}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4,flexWrap:"wrap"}}>
                    <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:999,background:sc.bg,color:sc.c}}>{sc.l}</span>
                    {log.channel&&<span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:999,background:CH_COLOR[log.channel]||"#6b7280",color:"#fff"}}>{CH_LABEL[log.channel]||log.channel}</span>}
                    {log.advertiser_name&&<span style={{fontSize:11,color:"#9ca3af"}}>{log.advertiser_name}</span>}
                  </div>
                  <div style={{fontSize:13,fontWeight:600,color:"#1a1d23",marginBottom:log.detail?3:0}}>{log.message}</div>
                  {log.detail&&log.detail!==log.message&&<div style={{fontSize:11,color:"#9ca3af",wordBreak:"break-all"}}>{log.detail.slice(0,120)}</div>}
                </div>
                <div style={{fontSize:11,color:"#9ca3af",flexShrink:0,marginTop:1}}>{fmt(log.created_at)}</div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ─── 준비중 페이지 ─── */
function ComingSoon({label}){
  return(
    <div style={{...card,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:300,color:"#d1d5db"}}>
      <div style={{fontSize:40,marginBottom:12}}>🚧</div>
      <div style={{fontSize:16,fontWeight:600,color:"#9ca3af"}}>{label}</div>
      <div style={{fontSize:13,marginTop:6}}>준비 중입니다</div>
    </div>
  );
}

/* ─── 앱 루트 ─── */
function App(){
  const [page,setPage]=useState("dashboard");
  const [user,setUser]=useState(getUser);
  const [advertisers,setAdvertisers]=useState([]);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);

  const loadAdvertisers=useCallback(async()=>{
    try{
      const data=await api("/advertisers");
      setAdvertisers((data||[]).map(adv=>{
        const accounts={};
        CHANNELS.forEach(ch=>{
          const acc=(adv.accounts||[]).find(a=>a.channel===ch);
          accounts[ch]=acc?{connected:acc.status==="connected",status:acc.status,error_message:acc.error_message,last_synced_at:acc.last_synced_at}:{connected:false,status:"pending"};
        });
        return{id:adv.id,name:adv.name,color:adv.brand_color,budget:Number(adv.monthly_budget||0),accounts};
      }));
      setError(null);
    }catch(e){setError(e.message);}
    finally{setLoading(false);}
  },[]);

  useEffect(()=>{if(user)loadAdvertisers();else setLoading(false);},[user]);

  const logout=()=>{clearAuth();setUser(null);setAdvertisers([]);};
  const isAdmin=user?.role==="admin";

  if(!user)return<LoginPage onLogin={u=>{setUser(u);setLoading(true);}}/>;

  const content=()=>{
    if(loading)return(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"60vh",gap:16}}>
        <Spinner/><div style={{color:"#9ca3af",fontSize:14}}>불러오는 중...</div>
      </div>
    );
    if(error)return(
      <div style={{...card,textAlign:"center",padding:40}}>
        <div style={{fontSize:32,marginBottom:12}}>⚠️</div>
        <div style={{fontWeight:700,marginBottom:8}}>서버 연결 실패</div>
        <div style={{color:"#9ca3af",fontSize:13,marginBottom:16}}>{error}</div>
        <button onClick={loadAdvertisers} style={btn()}>다시 시도</button>
      </div>
    );
    if(page==="dashboard")return<Dashboard advertisers={advertisers}/>;
    if(page==="accounts")return<AccountsPage advertisers={advertisers} onReload={loadAdvertisers} isAdmin={isAdmin}/>;
    if(page==="alerts")return<LogsPage/>;
    const found=NAV.find(n=>n.id===page)||NAV_DISABLED.find(n=>n.id===page);
    return<ComingSoon label={found?.label||page}/>;
  };

  return(
    <div style={{display:"flex",height:"100vh"}}>
      <Sidebar page={page} setPage={setPage} user={user} onLogout={logout}/>
      <main style={{flex:1,overflowY:"auto",padding:"24px 28px 48px",background:"#f0f2f5"}}>
        {content()}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
