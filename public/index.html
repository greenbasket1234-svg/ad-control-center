/* ── API 설정 ── */
const API_BASE = window.location.hostname === "localhost"
  ? "http://localhost:4000/api"
  : "/api";

/* 토큰 관리 */
const getToken = () => sessionStorage.getItem("acc_token");
const setToken = (t) => sessionStorage.setItem("acc_token", t);
const clearToken = () => sessionStorage.removeItem("acc_token");
const getUser = () => { try { return JSON.parse(sessionStorage.getItem("acc_user")||"null"); } catch{ return null; } };
const setUser = (u) => sessionStorage.setItem("acc_user", JSON.stringify(u));
const clearUser = () => sessionStorage.removeItem("acc_user");

async function apiFetch(path, options={}) {
  const token = getToken();
  const res = await fetch(API_BASE + path, {
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    ...options,
  });
  if (res.status === 401) {
    clearToken(); clearUser();
    window.location.reload();
    return;
  }
  if (!res.ok) {
    const err = await res.json().catch(()=>({ error: res.statusText }));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

async function apiLogin(email, password) {
  const res = await fetch(API_BASE + "/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "로그인 실패");
  setToken(data.token);
  setUser(data.user);
  return data.user;
}

/* 날짜 유틸 */
function getDateRange(days=7) {
  const end = new Date(); end.setDate(end.getDate()-1);
  const start = new Date(end); start.setDate(end.getDate()-(days-1));
  return {
    startDate: start.toISOString().slice(0,10),
    endDate:   end.toISOString().slice(0,10),
  };
}

/* ──────── Toast 알림 ──────── */
function Toast({toasts}){
  return(
    <div style={{position:"fixed",bottom:24,right:24,zIndex:999,display:"flex",flexDirection:"column",gap:10}}>
      {toasts.map(t=>(
        <div key={t.id} style={{
          display:"flex",alignItems:"center",gap:10,
          padding:"12px 18px",borderRadius:12,
          background:t.type==="success"?"#16a34a":t.type==="error"?"#e35353":"#2563eb",
          color:"#fff",fontSize:13,fontWeight:600,
          boxShadow:"0 4px 20px rgba(0,0,0,.15)",
          minWidth:240,maxWidth:360,
          animation:"slideIn .2s ease"
        }}>
          <span style={{fontSize:16}}>{t.type==="success"?"✓":t.type==="error"?"✕":"ℹ"}</span>
          <span>{t.message}</span>
        </div>
      ))}
      <style>{`@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}`}</style>
    </div>
  );
}

function useToast(){
  const [toasts,setToasts]=useState([]);
  const show=(message,type="success")=>{
    const id=Date.now();
    setToasts(prev=>[...prev,{id,message,type}]);
    setTimeout(()=>setToasts(prev=>prev.filter(t=>t.id!==id)),3500);
  };
  return {toasts, showToast:show};
}

/* ──────── Accounts Page ──────── */
function AccountsPage({advertisers,setAdvertisers,onReload,isAdmin}){
  const [modal,setModal]=useState(null);
  const [saving,setSaving]=useState(false);
  const [testStatus,setTestStatus]=useState({});
  const channels=["meta","naver","google","daangn","tiktok","kakao"];
  const {toasts,showToast}=useToast();

  const handleSave=async(data)=>{
    setSaving(true);
    try {
      const connectedChannels = channels.filter(ch=>data.accounts[ch]?.connected);

      // boolean/status 필드 제거하고 순수 API 키 값만 전송
      const cleanCreds=(ch)=>{
        const raw = data.accounts[ch]||{};
        const clean={};
        Object.entries(raw).forEach(([k,v])=>{
          if(typeof v==="string" && v && v!=="***" && k!=="connected" && k!=="status" && k!=="lastSynced")
            clean[k]=v;
        });
        return clean;
      };

      const accounts = connectedChannels.map(ch=>({
        channel: ch,
        credentials: cleanCreds(ch)
      }));

      let advertiserId;
      if(modal==="add"){
        const created = await apiFetch("/advertisers", {
          method:"POST",
          body: JSON.stringify({ name:data.name, brand_color:data.color, monthly_budget:data.budget, accounts })
        });
        advertiserId = created.id;
        showToast(`${data.name} 광고주가 등록됐습니다`, "success");
      } else {
        await apiFetch(`/advertisers/${modal.id}`, {
          method:"PUT",
          body: JSON.stringify({ name:data.name, brand_color:data.color, monthly_budget:data.budget, accounts })
        });
        advertiserId = modal.id;
        showToast(`${data.name} 정보가 저장됐습니다`, "success");
      }

      // 저장 완료 후 연결된 채널 자동 연동 테스트
      const testResults=[];
      for(const ch of connectedChannels){
        const creds = data.accounts[ch];
        const hasCreds = Object.values(creds).some(v=>v&&v!=="***"&&v!==true&&v!==false);
        if(hasCreds){
          try {
            const result = await apiFetch(`/advertisers/${advertiserId}/channels/${ch}/test`, {
              method:"POST",
              body: JSON.stringify({ credentials: creds })
            });
            testResults.push({ch, ok:result.ok, message:result.message});
            if(result.ok){
              showToast(`${CHANNEL_LABELS[ch]} 연동 성공 ✓`, "success");
            } else {
              showToast(`${CHANNEL_LABELS[ch]} 연동 실패: ${result.message}`, "error");
            }
          } catch(e) {
            showToast(`${CHANNEL_LABELS[ch]} 연동 오류: ${e.message}`, "error");
          }
        }
      }

      await onReload();
      setModal(null);
    } catch(e) {
      showToast("저장 실패: "+e.message, "error");
    } finally {
      setSaving(false);
    }
  };

  const handleDelete=async(id)=>{
    if(!window.confirm("광고주를 삭제할까요?")) return;
    try {
      await apiFetch(`/advertisers/${id}`, { method:"DELETE" });
      await onReload();
    } catch(e) { alert("삭제 실패: "+e.message); }
  };

  const handleTest=async(advertiserId, channel, credentials)=>{
    const key=`${advertiserId}_${channel}`;
    setTestStatus(s=>({...s,[key]:{loading:true}}));
    try {
      const result = await apiFetch(`/advertisers/${advertiserId}/channels/${channel}/test`, {
        method:"POST", body: JSON.stringify({ credentials })
      });
      setTestStatus(s=>({...s,[key]:{loading:false,...result}}));
      await onReload();
    } catch(e) {
      setTestStatus(s=>({...s,[key]:{loading:false,ok:false,message:e.message}}));

        </div>
        <button onClick={()=>setModal("add")} style={{padding:"9px 18px",borderRadius:10,border:"none",background:"#2563eb",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer"}}>
          + 광고주 추가
        </button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:16}}>
        {advertisers.map(adv=>{
          const connCnt=channels.filter(ch=>adv.accounts?.[ch]?.connected).length;
          const p=adv.budget>0?adv.stats.cost/adv.budget*100:0;
          return(
            <div key={adv.id} style={{...card,position:"relative"}}>
              <div style={{position:"absolute",top:18,right:18,display:"flex",gap:6}}>

                <button onClick={()=>handleDelete(adv.id)} style={{padding:"5px 12px",borderRadius:7,border:"none",background:"#fdecec",fontSize:12,fontWeight:600,cursor:"pointer",color:"#e35353"}}>삭제</button>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
                <div style={{width:40,height:40,borderRadius:11,background:adv.color,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:16,flexShrink:0}}>

                <div>

                  <div style={{fontSize:12,color:"#9ca3af",marginTop:2}}>채널 {connCnt}개 연동</div>
                </div>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
                {channels.map(ch=>{

                  return(
                    <span key={ch} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"5px 10px",borderRadius:6,fontSize:11,fontWeight:700,

                      color:connected?"#16a34a":status==="error"?"#e35353":"#9ca3af"}}>
                      <span style={{width:6,height:6,borderRadius:"50%",background:connected?"#16a34a":status==="error"?"#e35353":"#d1d5db"}}/>

                  );
                })}
              </div>
              <div style={{paddingTop:13,borderTop:"1px solid #f0f2f5",display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                {[["이번 달 광고비",fmtW(adv.stats.cost),"#1a1d23"],["월 예산",adv.budget?fmtW(adv.budget):"-","#1a1d23"],["소진율",adv.budget?p.toFixed(1)+"%":"-","#16a34a"]].map(([l,v,c])=>(

             onMouseEnter={e=>{e.currentTarget.style.borderColor="#9ca3af";e.currentTarget.style.color="#9ca3af";}}
             onMouseLeave={e=>{e.currentTarget.style.borderColor="#e5e7eb";e.currentTarget.style.color="#d1d5db";}}>
          <div style={{fontSize:28,marginBottom:8}}>＋</div>
          <div style={{fontSize:14}}>새 광고주 추가</div>

        <div style={{marginTop:28}}>
          <div style={{fontWeight:700,fontSize:16,marginBottom:14}}>채널별 연동 현황</div>
          {advertisers.map(adv=>(
            <div key={adv.id} style={{...card,marginBottom:14}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,paddingBottom:14,borderBottom:"1px solid #f0f2f5"}}>

                <div style={{fontWeight:700,fontSize:15}}>{adv.name}</div>
              </div>
              {channels.map(ch=>{
                const acc=adv.accounts?.[ch];
                const connected=acc?.connected;
                const status=acc?.status||"pending";
                const key=`${adv.id}_${ch}`;
                const ts=testStatus[key];
                return(
                  <div key={ch} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 0",borderBottom:"1px solid #f9fafb"}}>

      {modal&&(

    </div>
  );
}

function App(){

  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [currentUser,setCurrentUser]=useState(getUser);

  const handleLogin=(user)=>{ setCurrentUser(user); setLoading(true); };
  const handleLogout=()=>{ clearToken(); clearUser(); setCurrentUser(null); setAdvertisers([]); };

  const loadAdvertisers = async () => {
    try {
      const data = await apiFetch("/advertisers");
      const mapped = (data||[]).map(adv => {
        const accounts = {};
        ["naver","meta","google","daangn","tiktok","kakao"].forEach(ch => {
          const acc = (adv.accounts||[]).find(a=>a.channel===ch);
          accounts[ch] = { connected: acc?.status==="connected", status: acc?.status||"pending" };
        });
        return { id: adv.id, name: adv.name, color: adv.brand_color, budget: Number(adv.monthly_budget||0), accounts, stats:{cost:0,impressions:0,clicks:0,conversions:0,convAmount:0} };
      });
      setAdvertisers(mapped);
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  };

  useEffect(()=>{ if(currentUser) loadAdvertisers(); else setLoading(false); }, [currentUser]);

  if(!currentUser) return <LoginPage onLogin={handleLogin}/>;

  const isAdmin = currentUser.role==="admin";

  const pageContent=()=>{
    if(loading) return(
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"60vh",flexDirection:"column",gap:16}}>
        <div style={{width:36,height:36,border:"3px solid #e5e7eb",borderTop:"3px solid #2563eb",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
        <div style={{color:"#9ca3af",fontSize:14}}>데이터 불러오는 중...</div>
        <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      </div>
    );
    if(error) return(
      <div style={{...card,textAlign:"center",padding:40}}>
        <div style={{fontSize:32,marginBottom:12}}>⚠️</div>
        <div style={{fontWeight:700,fontSize:16,marginBottom:8}}>서버 연결 실패</div>
        <div style={{color:"#9ca3af",fontSize:13,marginBottom:16}}>{error}</div>
        <button onClick={loadAdvertisers} style={{padding:"8px 20px",background:"#2563eb",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>다시 시도</button>
      </div>
    );
    if(page==="dashboard") return <Dashboard advertisers={advertisers}/>;
    if(page==="accounts") return <AccountsPage advertisers={advertisers} setAdvertisers={setAdvertisers} onReload={loadAdvertisers} isAdmin={isAdmin}/>;
    const found=NAV.find(n=>n.id===page)||NAV_DISABLED.find(n=>n.id===page);
    return <Placeholder label={found?.label||page}/>;
  };

  return(
    <div style={{display:"flex",height:"100vh"}}>
      {/* Sidebar */}
      <aside style={{width:228,background:"#15181f",flexShrink:0,display:"flex",flexDirection:"column",padding:"16px 10px",overflowY:"auto"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"4px 8px 16px"}}>
          <div style={{width:32,height:32,borderRadius:9,background:"linear-gradient(135deg,#2563eb,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:13,flexShrink:0}}>AD</div>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:"#fff",lineHeight:1.2}}>광고관제소</div>
            <div style={{fontSize:10,color:"#6b7280"}}>Ad Control Center</div>
          </div>
        </div>
        {NAV.map(n=>(
          <div key={n.id} onClick={()=>setPage(n.id)}
            style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:8,fontSize:13,cursor:"pointer",marginBottom:1,
              background:page===n.id?"#262b35":"transparent",color:page===n.id?"#fff":"#8b939f",fontWeight:page===n.id?600:400,transition:".12s"}}>
            <span style={{width:16,textAlign:"center",fontSize:13}}>{n.icon}</span>{n.label}
          </div>
        ))}
        <div style={{height:1,background:"#262b35",margin:"12px 4px"}}/>
        <div style={{fontSize:10,color:"#4b505c",padding:"4px 10px 6px",letterSpacing:".04em"}}>준비중 · 연동 예정</div>
        {NAV_DISABLED.map(n=>(
          <div key={n.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:8,fontSize:13,color:"#4b505c",marginBottom:1}}>
            <span style={{width:16,textAlign:"center",fontSize:13}}>{n.icon}</span>{n.label}
          </div>
        ))}
        {/* 사용자 정보 + 로그아웃 */}
        <div style={{marginTop:"auto",paddingTop:12,borderTop:"1px solid #262b35"}}>
          <div style={{padding:"8px 10px",borderRadius:8,background:"#1e2330"}}>
            <div style={{fontSize:12,color:"#fff",fontWeight:600,marginBottom:2}}>{currentUser.name||currentUser.email}</div>
            <div style={{fontSize:10,color:"#6b7280"}}>{isAdmin?"관리자":currentUser.advertiser_name||"광고주"}</div>
          </div>
          <div onClick={handleLogout} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 10px",borderRadius:8,fontSize:12,color:"#6b7280",cursor:"pointer",marginTop:4}}
               onMouseEnter={e=>e.currentTarget.style.color="#e35353"}
               onMouseLeave={e=>e.currentTarget.style.color="#6b7280"}>
            ⎋ 로그아웃
          </div>
        </div>
      </aside>

      {/* Main */}
      <main style={{flex:1,overflowY:"auto",padding:"24px 28px 48px",background:"#f0f2f5"}}>
        {pageContent()}
      </main>
    </div>
  );
}

/* shared styles */
const card={background:"#fff",borderRadius:14,padding:"20px 22px",border:"1px solid #e9eaec"};
const tabBtn={padding:"6px 11px",borderRadius:7,fontSize:12,cursor:"pointer",fontWeight:500};
const lbl={fontSize:12,fontWeight:600,color:"#6b7280",marginBottom:5};
const inp={padding:"9px 12px",border:"1.5px solid #e5e7eb",borderRadius:8,fontSize:13,width:"100%",outline:"none",color:"#1a1d23",background:"#fff"};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
