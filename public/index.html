<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f2f5;color:#1a1d23;font-size:14px;height:100vh;overflow:hidden;}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect}=React;

const COLORS={
  meta:"#2563eb",naver:"#16a34a",google:"#ea4335",
  daangn:"#ff6f0f",tiktok:"#111827",kakao:"#ca8a04"
};
const CHANNEL_LABELS={
  meta:"Meta",naver:"네이버",google:"구글",
  daangn:"당근",tiktok:"틱톡",kakao:"카카오"
};
const BRAND_COLORS=["#f59e0b","#2563eb","#16a34a","#e35353","#7c3aed","#0891b2","#db2777","#374151"];

/* ── API 설정 ── */
const API_BASE = window.location.hostname === "localhost"
  ? "http://localhost:4000/api"
  : "/api";

/* 토큰 관리 */
const getToken = () => sessionStorage.getItem("acc_token");
const setToken = (t) => sessionStorage.setItem("acc_token", t);
const clearToken = () => sessionStorage.removeItem("acc_token");
const getUser = () => { try { return JSON.parse(sessionStorage.getItem("acc_user")||"null"); } catch{ return null; } };
const setUser = (u) => sessionStorage.setItem("acc_user", JSON.stringify(u));
const clearUser = () => sessionStorage.removeItem("acc_user");

async function apiFetch(path, options={}) {
  const token = getToken();
  const res = await fetch(API_BASE + path, {
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    ...options,
  });
  if (res.status === 401) {
    clearToken(); clearUser();
    window.location.reload();
    return;
  }
  if (!res.ok) {
    const err = await res.json().catch(()=>({ error: res.statusText }));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

async function apiLogin(email, password) {
  const res = await fetch(API_BASE + "/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "로그인 실패");
  setToken(data.token);
  setUser(data.user);
  return data.user;
}

/* 날짜 유틸 */
function getDateRange(days=7) {
  const end = new Date(); end.setDate(end.getDate()-1);
  const start = new Date(end); start.setDate(end.getDate()-(days-1));
  return {
    startDate: start.toISOString().slice(0,10),
    endDate:   end.toISOString().slice(0,10),
  };
}

const fmt=(n)=>n>=10000?`${(n/10000).toFixed(1)}만`:n.toLocaleString();
const fmtW=(n)=>`₩${n.toLocaleString()}`;
const pct=(a,b)=>b?((a/b)*100).toFixed(1)+"%" : "-";

/* ──────── Nav ──────── */
const NAV=[

  {id:"budget",icon:"◐",label:"브랜드 / 예산"},

/* ──────── Dashboard ──────── */
function Dashboard({advertisers}){
  const [period,setPeriod]=useState("30");
  const [channelStats,setChannelStats]=useState({});
  const [channelMix,setChannelMix]=useState([]);
  const [loading,setLoading]=useState(true);
  const channels=["meta","naver","google","daangn","tiktok","kakao"];

  function getDateRange(p){
    const end=new Date(); end.setDate(end.getDate()-1);
    const start=new Date(end);
    const days={"7":7,"14":14,"30":30,"60":60,"90":90,"오늘":0,"어제":1}[p]||30;
    if(p==="오늘"){ const t=new Date(); return{startDate:t.toISOString().slice(0,10),endDate:t.toISOString().slice(0,10)}; }
    start.setDate(end.getDate()-(days-1));
    return{startDate:start.toISOString().slice(0,10),endDate:end.toISOString().slice(0,10)};
  }

  const loadStats=async()=>{
    setLoading(true);
    const {startDate,endDate}=getDateRange(period);
    try{
      const [byChannel,mix]=await Promise.all([
        apiFetch(`/stats/by-channel?startDate=${startDate}&endDate=${endDate}`),
        apiFetch(`/stats/channel-mix?startDate=${startDate}&endDate=${endDate}`)
      ]);
      const statsMap={};
      (byChannel||[]).forEach(r=>{ statsMap[r.channel]={
        cost:Number(r.cost||0), impressions:Number(r.impressions||0),
        clicks:Number(r.clicks||0), conversions:Number(r.conversions||0),
        convAmount:Number(r.conversion_amount||0),
        ctr:Number(r.ctr||0), cpc:Number(r.cpc||0), cpm:Number(r.cpm||0), roas:Number(r.roas||0)
      };});
      setChannelStats(statsMap);
      setChannelMix(mix||[]);
    }catch(e){ console.error(e); }
    finally{ setLoading(false); }
  };

  useEffect(()=>{ loadStats(); },[period]);

  const totalCost=Object.values(channelStats).reduce((s,v)=>s+(v.cost||0),0);
  const totalImpr=Object.values(channelStats).reduce((s,v)=>s+(v.impressions||0),0);
  const totalClk=Object.values(channelStats).reduce((s,v)=>s+(v.clicks||0),0);
  const totalConv=Object.values(channelStats).reduce((s,v)=>s+(v.conversions||0),0);
  const totalAmt=Object.values(channelStats).reduce((s,v)=>s+(v.convAmount||0),0);

  // 광고주별 채널 합산
  const advCostMap={};
  channelMix.forEach(r=>{
    if(!advCostMap[r.id]) advCostMap[r.id]={name:r.name,color:r.brand_color,budget:Number(r.monthly_budget||0),total:0,channels:{}};
    advCostMap[r.id].total+=Number(r.cost||0);
    advCostMap[r.id].channels[r.channel]=Number(r.cost||0);
  });

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {/* Channel Mix */}
      <div style={card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
          <div>
            <div style={{fontWeight:700,fontSize:15,marginBottom:8}}>채널별 광고비 믹스</div>
            <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
              {channels.map(ch=>(
                <span key={ch} style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:12,color:"#6b7280"}}>
                  <span style={{width:8,height:8,borderRadius:2,background:COLORS[ch],display:"inline-block"}}/>
                  {CHANNEL_LABELS[ch]}
                </span>
              ))}
            </div>
          </div>
          <span style={{fontSize:11,color:"#9ca3af"}}>최근 {period}일 기준</span>
        </div>
        {loading?(
          <div style={{color:"#9ca3af",fontSize:13,padding:"10px 0"}}>데이터 불러오는 중...</div>
        ):Object.keys(advCostMap).length===0?(
          <div style={{color:"#9ca3af",fontSize:13,padding:"10px 0"}}>수집된 데이터가 없습니다. 배치를 실행해주세요.</div>
        ):(
          Object.values(advCostMap).map(adv=>{
            const pct=totalCost>0?(adv.total/totalCost*100):0;
            return(
              <div key={adv.name} style={{marginBottom:16}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <span style={{fontWeight:700,fontSize:13}}>{adv.name}</span>
                  <span style={{fontSize:12,color:"#6b7280"}}>
                    <b style={{color:"#1a1d23"}}>{fmtW(adv.total)}</b>
                    {Object.entries(adv.channels).map(([ch,cost])=>(
                      <span key={ch}> · {CHANNEL_LABELS[ch]} {fmtW(cost)}</span>
                    ))}
                  </span>
                </div>
                <div style={{height:9,borderRadius:5,background:"#f0f2f5",overflow:"hidden",display:"flex"}}>
                  {Object.entries(adv.channels).map(([ch,cost])=>(
                    <div key={ch} style={{width:`${adv.total>0?cost/adv.total*100:0}%`,background:COLORS[ch]}}/>
                  ))}
                </div>
              </div>
            );
          })
        )}
        <div style={{fontSize:12,color:"#9ca3af",marginTop:4}}>전체 합계 {fmtW(totalCost)} · 연결된 채널 데이터를 자동 합산합니다</div>
      </div>

      {/* Stats Table */}
      <div style={card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
          <div style={{fontWeight:700,fontSize:15}}>광고 성과 지표</div>
          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            {[["매체별","ch"],["계정별","acc"],["기간별","period"]].map(([l,v])=>(
              <button key={v} onClick={()=>setPeriod(v)} style={{...tabBtn,background:period===v?"#2563eb":"transparent",color:period===v?"#fff":"#9ca3af",border:"none"}}>{l}</button>
            ))}
            <div style={{width:1,background:"#e5e7eb",margin:"0 4px"}}/>
            {["오늘","어제","7","14","30","60","90"].map(p=>(
              <button key={p} onClick={()=>setPeriod(p)} style={{...tabBtn,background:period===p?"#2563eb":"transparent",color:period===p?"#fff":"#9ca3af",border:"none"}}>{p==="오늘"||p==="어제"?p:`${p}일`}</button>
            ))}
          </div>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:780}}>
            <thead>
              <tr>{["매체","총소진","노출","CPM","클릭","CTR","CPC","전환","전환율","전환매출","CPA","ROAS"].map(h=>(
                <th key={h} style={{textAlign:h==="매체"?"left":"right",padding:"8px 10px",borderBottom:"1px solid #f0f2f5",fontWeight:500,color:"#9ca3af",fontSize:12,whiteSpace:"nowrap"}}>{h}</th>
              ))}</tr>
            </thead>
            <tbody>
              {channels.map(ch=>{
                if(ch==="tiktok") return(
                  <tr key={ch}>
                    <td style={{padding:"12px 10px",fontWeight:600}}>
                      틱톡 <span style={{fontSize:10,background:"#f3f4f6",color:"#9ca3af",padding:"2px 7px",borderRadius:999,fontWeight:700,marginLeft:4}}>연동 대기</span>
                    </td>
                    {Array(11).fill(0).map((_,i)=><td key={i} style={{textAlign:"right",padding:"12px 10px",color:"#d1d5db"}}>-</td>)}
                  </tr>
                );
                const s=channelStats[ch]||{cost:0,impressions:0,clicks:0,conversions:0,convAmount:0};
                const cpm=s.impressions?(s.cost/s.impressions*1000).toFixed(0):"-";
                const ctr=s.impressions?(s.clicks/s.impressions*100).toFixed(2)+"%":"-";
                const cpc=s.clicks?(s.cost/s.clicks).toFixed(0):"-";
                const cvr=s.clicks?(s.conversions/s.clicks*100).toFixed(2)+"%":"-";
                const cpa=s.conversions?(s.cost/s.conversions).toFixed(0):"-";
                const roas=s.cost?(s.convAmount/s.cost*100).toFixed(0):"-";
                const hasData=s.cost>0||s.impressions>0;
                return(
                  <tr key={ch} style={{borderBottom:"1px solid #f9fafb",opacity:hasData?1:0.4}}>
                    <td style={{padding:"12px 10px",fontWeight:600}}>{CHANNEL_LABELS[ch]}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{hasData?fmtW(s.cost):"-"}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{hasData?s.impressions.toLocaleString():"-"}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{cpm==="-"?"-":`₩${Number(cpm).toLocaleString()}`}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{hasData?s.clicks.toLocaleString():"-"}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{ctr}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{cpc==="-"?"-":`₩${Number(cpc).toLocaleString()}`}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{hasData?s.conversions:"-"}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{cvr}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{s.convAmount?fmtW(s.convAmount):"-"}</td>
                    <td style={{textAlign:"right",padding:"12px 10px"}}>{cpa==="-"?"-":`₩${Number(cpa).toLocaleString()}`}</td>
                    <td style={{textAlign:"right",padding:"12px 10px",color:roas!=="-"&&Number(roas)>100?"#16a34a":roas!=="-"&&Number(roas)<100?"#e35353":"inherit"}}>{roas==="-"?"-":`${roas}%`}</td>
                  </tr>
                );
              })}
              <tr style={{background:"#fafafa",fontWeight:700}}>
                <td style={{padding:"12px 10px"}}>전체 합산<div style={{fontSize:11,fontWeight:400,color:"#9ca3af",marginTop:2}}>모든 매체</div></td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{fmtW(totalCost)}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{totalImpr.toLocaleString()}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{totalImpr?`₩${Math.round(totalCost/totalImpr*1000).toLocaleString()}`:"-"}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{totalClk.toLocaleString()}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{totalImpr?(totalClk/totalImpr*100).toFixed(2)+"%":"-"}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{totalClk?`₩${Math.round(totalCost/totalClk).toLocaleString()}`:"-"}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{totalConv}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{totalClk?(totalConv/totalClk*100).toFixed(2)+"%":"-"}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{totalAmt?fmtW(totalAmt):"-"}</td>
                <td style={{textAlign:"right",padding:"12px 10px"}}>{totalConv?`₩${Math.round(totalCost/totalConv).toLocaleString()}`:"-"}</td>
                <td style={{textAlign:"right",padding:"12px 10px",color:"#16a34a"}}>{totalCost?Math.round(totalAmt/totalCost*100)+"%":"-"}</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div style={{fontSize:11,color:"#9ca3af",marginTop:12}}>CPM=노출단가, CPC=클릭단가, CTR=클릭/노출, CPA=전환당비용, ROAS=매출/광고비</div>
      </div>

      {/* Bottom row */}
      <div style={{display:"flex",gap:16}}>
        {/* Budget */}
        <div style={{...card,flex:1}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>브랜드별 예산 소진율</div>
          {Object.values(advCostMap).length===0?(
            <div style={{fontSize:13,color:"#9ca3af"}}>수집된 데이터가 없습니다</div>
          ):Object.values(advCostMap).map(adv=>{
            const budget=advertisers.find(a=>a.name===adv.name)?.budget||0;
            const p=budget>0?(adv.total/budget*100):0;
            return(
              <div key={adv.name} style={{marginBottom:16}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <span style={{display:"flex",alignItems:"center",gap:7,fontWeight:600,fontSize:13}}>
                    <span style={{width:8,height:8,borderRadius:2,background:adv.color,display:"inline-block"}}/>
                    {adv.name}
                  </span>
                  <span style={{fontSize:12,color:"#6b7280"}}>
                    {fmtW(adv.total)} / {budget?fmtW(budget):"-"}
                    {budget>0&&<span style={{marginLeft:8,background:"#eafaf0",color:"#16a34a",fontWeight:700,fontSize:11,padding:"2px 7px",borderRadius:5}}>{p.toFixed(1)}%</span>}
                  </span>
                </div>
                <div style={{height:8,borderRadius:5,background:"#f0f2f5",overflow:"hidden"}}>
                  <div style={{width:`${Math.min(p,100)}%`,height:"100%",background:adv.color,borderRadius:5}}/>
                </div>
              </div>
            );
          })}
        </div>
        {/* Recommendation */}
        <div style={{...card,flex:1}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontWeight:700,fontSize:15}}>추천 조치</div>
            <span style={{background:"#eafaf0",color:"#16a34a",fontWeight:700,fontSize:11,padding:"3px 9px",borderRadius:999}}>0건</span>
          </div>
          <div style={{fontSize:13,color:"#9ca3af",paddingTop:6}}>현재 추천할 조치가 없습니다 — 모든 캠페인이 안정 범위 안에서 운영 중입니다.</div>
        </div>
      </div>

      {/* Risk + Best */}
      <div style={{display:"flex",gap:16}}>
        <div style={{...card,flex:1}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>🔥 위험 광고 (소재 피로도)</div>
          <div style={{fontSize:13,color:"#9ca3af"}}>위험 소재 없음</div>
        </div>
        <div style={{...card,flex:1}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>⭐ 우수 광고</div>
          {[
            {name:"20260609_인스타3_설연휴",brand:"웹컴투바베큐",ctr:"1.48%",cpm:"₩6,300",fatigue:0},
            {name:"20260609_인스타1_야장",brand:"웹컴투바베큐",ctr:"1.89%",cpm:"₩5,498",fatigue:10},
            {name:"20260609_인스타2_퇴근캠핑",brand:"웹컴투바베큐",ctr:"1.44%",cpm:"₩5,194",fatigue:10},
          ].map((a,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 0",borderBottom:i<2?"1px solid #f0f2f5":"none"}}>
              <div>
                <div style={{fontWeight:600,fontSize:13,marginBottom:3}}>{a.name}</div>
                <div style={{fontSize:11,color:"#9ca3af"}}>{a.brand} · CTR {a.ctr} · CPM {a.cpm}</div>
              </div>
              <span style={{fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:999,background:a.fatigue===0?"#eafaf0":"#fdecec",color:a.fatigue===0?"#16a34a":"#e35353"}}>피로 {a.fatigue}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ──────── Toast 알림 ──────── */
function Toast({toasts}){
  return(
    <div style={{position:"fixed",bottom:24,right:24,zIndex:999,display:"flex",flexDirection:"column",gap:10}}>
      {toasts.map(t=>(
        <div key={t.id} style={{
          display:"flex",alignItems:"center",gap:10,
          padding:"12px 18px",borderRadius:12,
          background:t.type==="success"?"#16a34a":t.type==="error"?"#e35353":"#2563eb",
          color:"#fff",fontSize:13,fontWeight:600,
          boxShadow:"0 4px 20px rgba(0,0,0,.15)",
          minWidth:240,maxWidth:360,
          animation:"slideIn .2s ease"
        }}>
          <span style={{fontSize:16}}>{t.type==="success"?"✓":t.type==="error"?"✕":"ℹ"}</span>
          <span>{t.message}</span>
        </div>
      ))}
      <style>{`@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}`}</style>
    </div>
  );
}

function useToast(){
  const [toasts,setToasts]=useState([]);
  const show=(message,type="success")=>{
    const id=Date.now();
    setToasts(prev=>[...prev,{id,message,type}]);
    setTimeout(()=>setToasts(prev=>prev.filter(t=>t.id!==id)),3500);
  };
  return {toasts, showToast:show};
}

        {[["all","전체"],["success","성공"],["error","오류"],["warning","경고"],["batch","배치"],["connect","연동"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)}
            style={{padding:"6px 14px",borderRadius:20,border:"none",fontSize:12,fontWeight:600,cursor:"pointer",
              background:filter===v?"#2563eb":"#f3f4f6",color:filter===v?"#fff":"#6b7280"}}>
            {l} {filter===v&&`(${filtered.length})`}
          </button>
        ))}
      </div>

      {loading?(
        <div style={{textAlign:"center",padding:40,color:"#9ca3af"}}>불러오는 중...</div>
      ):filtered.length===0?(
        <div style={{...card,textAlign:"center",padding:40,color:"#9ca3af"}}>
          <div style={{fontSize:32,marginBottom:12}}>📋</div>
          <div>로그가 없습니다</div>
        </div>
      ):(
        <div style={{...card,padding:0,overflow:"hidden"}}>
          {filtered.map((log,i)=>{
            const sc=statusConfig[log.status]||statusConfig.info;
            const tc=typeConfig[log.type]||typeConfig.info;
            return(
              <div key={log.id} style={{
                display:"flex",alignItems:"flex-start",gap:14,
                padding:"14px 20px",
                borderBottom:i<filtered.length-1?"1px solid #f9fafb":"none",
                background:i%2===0?"#fff":"#fafafa"
              }}>
                {/* 타입 아이콘 */}
                <div style={{fontSize:18,flexShrink:0,marginTop:2}}>{tc.icon}</div>

                {/* 내용 */}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
                    {/* 상태 배지 */}
                    <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:999,
                      background:sc.bg,color:sc.color}}>
                      {sc.label}
                    </span>
                    {/* 채널 배지 */}
                    {log.channel&&(
                      <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:999,
                        background:CHANNEL_COLORS[log.channel]||"#6b7280",color:"#fff"}}>
                        {CHANNEL_NAMES[log.channel]||log.channel}
                      </span>
                    )}
                    {/* 광고주 */}
                    {log.advertiser_name&&(
                      <span style={{fontSize:11,color:"#9ca3af"}}>{log.advertiser_name}</span>
                    )}
                  </div>
                  <div style={{fontSize:13,fontWeight:600,color:"#1a1d23",marginBottom:log.detail?4:0}}>
                    {log.message}
                  </div>
                  {log.detail&&log.detail!==log.message&&(
                    <div style={{fontSize:11,color:"#9ca3af",wordBreak:"break-all"}}>{log.detail}</div>
                  )}
                </div>

                {/* 시간 */}
                <div style={{fontSize:11,color:"#9ca3af",flexShrink:0,marginTop:2}}>
                  {formatTime(log.created_at)}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ──────── Placeholder ──────── */
function Placeholder({label}){
  return(
    <div style={{...card,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:320,color:"#d1d5db"}}>
      <div style={{fontSize:40,marginBottom:12}}>🚧</div>
      <div style={{fontSize:16,fontWeight:600,color:"#9ca3af"}}>{label}</div>
      <div style={{fontSize:13,marginTop:6}}>준비 중입니다</div>
    </div>
  );
}

/* ──────── Login Page ──────── */
function LoginPage({onLogin}){
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");

  const handleSubmit=async(e)=>{
    e.preventDefault();
    setLoading(true); setError("");
    try {
      const user = await apiLogin(email, pw);
      onLogin(user);
    } catch(e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  return(
    <div style={{minHeight:"100vh",background:"#f0f2f5",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#fff",borderRadius:18,padding:"40px 36px",width:400,boxShadow:"0 4px 24px rgba(0,0,0,.08)"}}>
        {/* 로고 */}
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:32}}>
          <div style={{width:42,height:42,borderRadius:12,background:"linear-gradient(135deg,#2563eb,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:16}}>AD</div>
          <div>
            <div style={{fontSize:18,fontWeight:700}}>광고관제소</div>
            <div style={{fontSize:12,color:"#9ca3af"}}>Ad Control Center</div>
          </div>
        </div>

        <form onSubmit={handleSubmit}>
          <div style={{marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:600,color:"#6b7280",marginBottom:6}}>이메일</div>
            <input
              style={{width:"100%",padding:"11px 14px",border:"1.5px solid #e5e7eb",borderRadius:9,fontSize:14,outline:"none",color:"#1a1d23"}}
              type="email" placeholder="이메일 입력" value={email}
              onChange={e=>setEmail(e.target.value)} required autoFocus
              onFocus={e=>e.target.style.borderColor="#2563eb"}
              onBlur={e=>e.target.style.borderColor="#e5e7eb"}
            />
          </div>
          <div style={{marginBottom:20}}>
            <div style={{fontSize:12,fontWeight:600,color:"#6b7280",marginBottom:6}}>비밀번호</div>
            <input
              style={{width:"100%",padding:"11px 14px",border:"1.5px solid #e5e7eb",borderRadius:9,fontSize:14,outline:"none",color:"#1a1d23"}}
              type="password" placeholder="비밀번호 입력" value={pw}
              onChange={e=>setPw(e.target.value)} required
              onFocus={e=>e.target.style.borderColor="#2563eb"}
              onBlur={e=>e.target.style.borderColor="#e5e7eb"}
            />
          </div>
          {error&&<div style={{background:"#fdecec",color:"#e35353",borderRadius:8,padding:"10px 14px",fontSize:13,marginBottom:14}}>{error}</div>}
          <button type="submit" disabled={loading}
            style={{width:"100%",padding:"12px",background:loading?"#93c5fd":"#2563eb",color:"#fff",border:"none",borderRadius:9,fontSize:14,fontWeight:700,cursor:loading?"not-allowed":"pointer",transition:".15s"}}>
            {loading?"로그인 중...":"로그인"}
          </button>
        </form>

        <div style={{marginTop:24,padding:"16px",background:"#f9fafb",borderRadius:9,fontSize:12,color:"#6b7280"}}>
          <div style={{fontWeight:600,marginBottom:4}}>최초 설정이 필요한 경우</div>
          <div>관리자 계정이 없으면 아래 API로 생성하세요:</div>
          <code style={{display:"block",marginTop:6,background:"#f0f2f5",padding:"6px 10px",borderRadius:6,fontSize:11,color:"#374151",wordBreak:"break-all"}}>
            POST /api/auth/setup
          </code>
        </div>
      </div>
    </div>
  );
}


function App(){
  const [page,setPage]=useState("dashboard");
  const [advertisers,setAdvertisers]=useState([]);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [currentUser,setCurrentUser]=useState(getUser);

  const handleLogin=(user)=>{ setCurrentUser(user); setLoading(true); };
  const handleLogout=()=>{ clearToken(); clearUser(); setCurrentUser(null); setAdvertisers([]); };

  const loadAdvertisers = async () => {
    try {
      const data = await apiFetch("/advertisers");
      const mapped = (data||[]).map(adv => {
        const accounts = {};
        ["naver","meta","google","daangn","tiktok","kakao"].forEach(ch => {
          const acc = (adv.accounts||[]).find(a=>a.channel===ch);
          accounts[ch] = { connected: acc?.status==="connected", status: acc?.status||"pending" };
        });
        return { id: adv.id, name: adv.name, color: adv.brand_color, budget: Number(adv.monthly_budget||0), accounts, stats:{cost:0,impressions:0,clicks:0,conversions:0,convAmount:0} };
      });
      setAdvertisers(mapped);
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  };

  useEffect(()=>{ if(currentUser) loadAdvertisers(); else setLoading(false); }, [currentUser]);

  if(!currentUser) return <LoginPage onLogin={handleLogin}/>;

  const isAdmin = currentUser.role==="admin";

  const pageContent=()=>{
    if(loading) return(
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"60vh",flexDirection:"column",gap:16}}>
        <div style={{width:36,height:36,border:"3px solid #e5e7eb",borderTop:"3px solid #2563eb",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
        <div style={{color:"#9ca3af",fontSize:14}}>데이터 불러오는 중...</div>
        <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      </div>
    );
    if(error) return(
      <div style={{...card,textAlign:"center",padding:40}}>
        <div style={{fontSize:32,marginBottom:12}}>⚠️</div>
        <div style={{fontWeight:700,fontSize:16,marginBottom:8}}>서버 연결 실패</div>
        <div style={{color:"#9ca3af",fontSize:13,marginBottom:16}}>{error}</div>
        <button onClick={loadAdvertisers} style={{padding:"8px 20px",background:"#2563eb",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>다시 시도</button>
      </div>
    );
    if(page==="dashboard") return <Dashboard advertisers={advertisers}/>;
    if(page==="accounts") return <AccountsPage advertisers={advertisers} setAdvertisers={setAdvertisers} onReload={loadAdvertisers} isAdmin={isAdmin}/>;
    if(page==="alerts") return <LogsPage/>;
    const found=NAV.find(n=>n.id===page)||NAV_DISABLED.find(n=>n.id===page);
    return <Placeholder label={found?.label||page}/>;
  };

  return(
    <div style={{display:"flex",height:"100vh"}}>
      {/* Sidebar */}
      <aside style={{width:228,background:"#15181f",flexShrink:0,display:"flex",flexDirection:"column",padding:"16px 10px",overflowY:"auto"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"4px 8px 16px"}}>
          <div style={{width:32,height:32,borderRadius:9,background:"linear-gradient(135deg,#2563eb,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:13,flexShrink:0}}>AD</div>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:"#fff",lineHeight:1.2}}>광고관제소</div>
            <div style={{fontSize:10,color:"#6b7280"}}>Ad Control Center</div>
          </div>
        </div>
        {NAV.map(n=>(
          <div key={n.id} onClick={()=>setPage(n.id)}
            style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:8,fontSize:13,cursor:"pointer",marginBottom:1,
              background:page===n.id?"#262b35":"transparent",color:page===n.id?"#fff":"#8b939f",fontWeight:page===n.id?600:400,transition:".12s"}}>
            <span style={{width:16,textAlign:"center",fontSize:13}}>{n.icon}</span>{n.label}
          </div>
        ))}
        <div style={{height:1,background:"#262b35",margin:"12px 4px"}}/>
        <div style={{fontSize:10,color:"#4b505c",padding:"4px 10px 6px",letterSpacing:".04em"}}>준비중 · 연동 예정</div>
        {NAV_DISABLED.map(n=>(
          <div key={n.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:8,fontSize:13,color:"#4b505c",marginBottom:1}}>
            <span style={{width:16,textAlign:"center",fontSize:13}}>{n.icon}</span>{n.label}
          </div>
        ))}
        {/* 사용자 정보 + 로그아웃 */}
        <div style={{marginTop:"auto",paddingTop:12,borderTop:"1px solid #262b35"}}>
          <div style={{padding:"8px 10px",borderRadius:8,background:"#1e2330"}}>
            <div style={{fontSize:12,color:"#fff",fontWeight:600,marginBottom:2}}>{currentUser.name||currentUser.email}</div>
            <div style={{fontSize:10,color:"#6b7280"}}>{isAdmin?"관리자":currentUser.advertiser_name||"광고주"}</div>
          </div>
          <div onClick={handleLogout} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 10px",borderRadius:8,fontSize:12,color:"#6b7280",cursor:"pointer",marginTop:4}}
               onMouseEnter={e=>e.currentTarget.style.color="#e35353"}
               onMouseLeave={e=>e.currentTarget.style.color="#6b7280"}>
            ⎋ 로그아웃
          </div>
        </div>
      </aside>

      {/* Main */}
      <main style={{flex:1,overflowY:"auto",padding:"24px 28px 48px",background:"#f0f2f5"}}>
        {pageContent()}
      </main>
    </div>
  );
}

/* shared styles */
const card={background:"#fff",borderRadius:14,padding:"20px 22px",border:"1px solid #e9eaec"};
const tabBtn={padding:"6px 11px",borderRadius:7,fontSize:12,cursor:"pointer",fontWeight:500};
const lbl={fontSize:12,fontWeight:600,color:"#6b7280",marginBottom:5};
const inp={padding:"9px 12px",border:"1.5px solid #e5e7eb",borderRadius:8,fontSize:13,width:"100%",outline:"none",color:"#1a1d23",background:"#fff"};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
